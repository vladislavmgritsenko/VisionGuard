name: vision-guard-production

services:
  api:
    image: ${IMAGE_NAME:-vision-guard}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      MODEL_MODE: yolo
      MODEL_PATH: models/yolo11n.pt
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.35}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-8}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-1}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in .env.production},api,localhost,127.0.0.1
      DOCS_ENABLED: "false"
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env.production}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPU_LIMIT:-2.0}
    networks:
      - backend
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  proxy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    logging: *logging

networks:
  backend:
    internal: false

volumes:
  caddy_data:
  caddy_config:
